feature: 2026-05-24-medqa-vmiss-eval
created: 2026-05-24

steps:
  - action: "trace 工具模块骨架：建 samd/diagnosis.py，含 make_trace_step(step_idx, path_type, accept_length, best_candidate?, candidates?, tree_logits?, t2d_buffer?) + _token_reachable(token_id, t2d) -> Optional[bool]；sequence path 仅填三字段，tree path 按 candidates/tree_logits/t2d 算 V_miss 字段"
    exit_signal: "python -c 'from samd.diagnosis import make_trace_step; d = make_trace_step(0, \"sequence\", 3); assert set(d.keys()) == {\"step_idx\",\"path_type\",\"accept_length\",\"first_rejected_token_id\",\"first_rejected_reachable\",\"verifier_target_token_id\",\"verifier_target_reachable\"}; assert d[\"first_rejected_token_id\"] is None' 通过"
    status: done

  - action: "trace 数据通道改造：(a) samd/utils.py:SamdGenerationConfig 加 collect_diagnosis_trace: bool = field(default=False)；(b) samd/samd_model.py:Outputs namedtuple 加第 5 字段 diagnosis_trace，用 namedtuple(..., defaults=[None]) 兜底；(c) SamdModel.decode 返回值扩为 (sample_p, new_tokens, trace_meta)，trace_meta 含 path_type/best_candidate/accept_length/candidates/tree_logits 五字段；(d) SamdModel.generate 维护 _step_trace 累积器，按开关调 samd.diagnosis.make_trace_step 并 append；(e) generate 末尾把累积写入 Outputs(diagnosis_trace=_step_trace)"
    exit_signal: "构造 SamdModel + 调 generate(input_ids, gen_config=SamdGenerationConfig(collect_diagnosis_trace=True, max_new_tokens=20)) → outputs.diagnosis_trace is not None 且 len(outputs.diagnosis_trace) == outputs.decode_steps；每 step dict 含 7 个 key；再换 collect_diagnosis_trace=False 跑同一 prompt → outputs.diagnosis_trace is None 且 outputs.output_ids 与 trace 模式 byte-equal"
    status: done

  - action: "forward_func 透传 + answer_file 持久化：(a) evaluation/inference_samd.py:samd_forward 加 diagnosis_trace_out: Optional[list] = None kwarg，按非 None 设 collect_diagnosis_trace 并 extend trace；(b) inference_samd.py CLI 加 --collect_diagnosis_trace flag，透传 kwarg；(c) evaluation/eval_llama3.py:get_model_answers 接 collect_diagnosis_trace kwarg；turn 循环按开关创建 diagnosis_trace_out=[]、传 forward_func、收回后 append 到 cur_diagnosis_traces；(d) choices[i] 字典按开关 emit diagnosis_traces 字段（List[List[Dict]]，外层对齐 turns）"
    exit_signal: "python -m evaluation.inference_samd --tree_method eagle3 --tree_model_path <EAGLE3_PATH> --model-path <BASE_PATH> --model-type llama3 --template llama3 --bench-name spec_bench --question-end 1 --model-id smoke-trace --collect_diagnosis_trace → 输出 model_answer/smoke-trace.jsonl，jq '.choices[0].diagnosis_traces[0] | length' 等于 .choices[0].decoding_steps[0]"
    status: done

  - action: "MedQA 数据准备：写 evaluation/medqa_prep.py，CLI 接 --num_questions（默认 80）+ --split（默认 'test'）+ --out_path（默认 'evaluation/data/medqa/question.jsonl'）；用 datasets.load_dataset('bigbio/med_qa', 'med_qa_en_source') 下载 en split，按 D6 prompt 模板拼成 turns[0]；落 jsonl；import datasets 失败给清晰 ImportError 替换提示"
    exit_signal: "python -m evaluation.medqa_prep --num_questions 80 → evaluation/data/medqa/question.jsonl 存在且 wc -l == 80；head -n 1 解析为 JSON dict 含 question_id (int) / category ('medqa') / turns (List[str])；turns[0] 含子串 'Answer:'"
    status: done

  - action: "三组对照跑批入口：写 scripts/run_medqa_vmiss_eval.sh，sequential 跑三组：(a) 纯 EAGLE3: inference_samd.py --tree_method eagle3 --samd_len_threshold 999 --sam_path '' --collect_diagnosis_trace --model-id pure_eagle3 → pure_eagle3.jsonl；(b) SAM[EAGLE3]: inference_samd.py --tree_method eagle3 --samd_len_threshold 5 --sam_path <SAM_PATH> --collect_diagnosis_trace --model-id samd_eagle3 → samd_eagle3.jsonl；(c) SAM-only: inference_sam_only.py --model-id sam_only → sam_only.jsonl；都 --bench-name medqa --template llama3 --model-type llama3"
    exit_signal: "bash scripts/run_medqa_vmiss_eval.sh 跑完后 ls evaluation/data/medqa/model_answer/{pure_eagle3,samd_eagle3,sam_only}.jsonl 三文件存在，各 wc -l == 80；pure_eagle3.jsonl 和 samd_eagle3.jsonl 含 diagnosis_traces 字段，sam_only.jsonl 不含"
    status: done

  - action: "V_miss 分析脚本：写 evaluation/analyze_vmiss.py，CLI 接 --pure_eagle3 / --samd_eagle3 / --sam_only 三个 jsonl 路径；每组遍历 choices[*].diagnosis_traces 计算 mean_accept_length / total_steps / tree_steps / tree_step_vmiss_rate；输出 markdown 表 + sanity 计数行（每组 step 数 / tree-step 数 / sequence-step 数）；sam_only 组 tree_step_vmiss_rate 显式 'N/A'"
    exit_signal: "python -m evaluation.analyze_vmiss --pure_eagle3 evaluation/data/medqa/model_answer/pure_eagle3.jsonl --samd_eagle3 .../samd_eagle3.jsonl --sam_only .../sam_only.jsonl → stdout 含 markdown 表头 '| group | mean_accept_length | tree_steps | tree_step_vmiss_rate |' + 三行；pure_eagle3 行 tree_steps == 该组 total_steps；samd_eagle3 行 tree_steps < total_steps；sam_only 行 tree_step_vmiss_rate 列为 'N/A'"
    status: done

