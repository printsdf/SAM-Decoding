feature: 2026-05-25-bench-cross-domain-speedup
created: 2026-05-25

steps:
  - action: "medquad_prep.py 骨架：写 evaluation/medquad_prep.py，CLI 接 --num_questions (默认 200) + --out_path (默认 evaluation/data/medquad/question.jsonl)；用 datasets.load_dataset('lavita/MedQuAD', split='train') 下载，截前 N 题；free-form prompt 模板（直接 question 字段作 turns[0]，无 MCQ 结构）；import datasets 失败给清晰 ImportError 替换提示（沿用 medqa_prep 同 pattern）"
    exit_signal: "python -m evaluation.medquad_prep --num_questions 5 --out_path /tmp/medquad_smoke.jsonl → 文件 5 行；head -n 1 解析 JSON 含 question_id (int) / category=='medquad' / turns:List[str]；turns[0] 不含 'A.' / 'B.' / 'Final answer:' / 'Answer:' 等 MCQ 强结构标记"
    status: done

  - action: "speed.py 扩 medquad 类别：修改 evaluation/speed.py:73:get_single_speedup 的 task 列表加 'medquad'；其他逻辑（speed 函数 + multi-run）不动"
    exit_signal: "python -m evaluation.speed --file-path <samd.jsonl> --base-path <baseline.jsonl> --tokenizer-path <model_path> 跑通后 stdout 含 8 条 task 段（mt_bench / translation / summarization / qa / math_reasoning / rag / medquad / overall）；其中 medquad 段 #Mean accepted tokens / Tokens per second / Speedup ratio 都是数字（非 None / 非 N/A）"
    status: done

  - action: "single sh 跑批入口：写 scripts/run_bench_cross_domain_speedup.sh，sequential 跑完所有阶段：(a) fetch [cp ../EAGLE mt_bench → data/mt_bench + medquad_prep --num_questions 200]；(b) phase1 [8 inference, trace OFF: 4 组 × 2 bench]；(c) phase1 analyze [speed.py 跑 6 个 group×bench]；(d) phase2 [4 inference, trace ON: EAGLE3 两组 × 2 bench]；(e) phase2 analyze [analyze_vmiss.py 跑 2 个 bench，sam_only 复用 phase1 文件保 N/A 行]；含 source .env / notify() / trap ERR / fmt_elapsed 飞书通知（沿用上一个 feature 模式）；不拆 sub-script（attention.md 项目约定）"
    exit_signal: "bash -n scripts/run_bench_cross_domain_speedup.sh shell 语法通过；脚本读 .env 失败时 fallback 到默认硬编码路径（不强制 .env）；脚本不存在调用 bash scripts/run_phase*.sh 等 sub-script"
    status: done

  - action: "端到端 GPU 跑批 + 数据落盘：在 GPU 上 bash scripts/run_bench_cross_domain_speedup.sh 跑完，预算 ~10 小时；中间不需要用户交互；飞书通知每阶段进度"
    exit_signal: "(a) evaluation/data/{mt_bench,medquad}/model_answer/ 各含 6 个 jsonl 文件（baseline + pure_eagle3_p1 + samd_eagle3_p1 + sam_only_p1 + pure_eagle3_p2 + samd_eagle3_p2）；(b) phase1 三组 samd 相对 baseline 的 speedup_ratio 均 > 1.0（pure_eagle3 / samd_eagle3 > 2.0 期望，sam_only > 1.0 接受接近 1.0）；(c) phase2 EAGLE3 两组在两个 bench 上的 V_miss rate 均落在 [0%, 60%]（非 None 非 N/A）；(d) sam_only 行 tree_step_vmiss_rate=='N/A'"
    status: done

  - action: "结果汇总：跑完后 stdout 含 phase1 6 张子任务表（speed.py 输出，每组×每 bench）+ phase2 2 张表（analyze_vmiss.py 输出，每 bench 一张），用于 acceptance 第 9 节研究发现归并"
    exit_signal: "飞书 ✅ ALL DONE 通知含 phase1 / phase2 总用时 + 简短结果摘要；本地 stdout/log 文件含 mt_bench / medquad 各 1 张 V_miss markdown 表 + 6 段 speed.py 任务输出"
    status: done

