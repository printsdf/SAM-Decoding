feature: 2026-05-29-static-sam-offline-corpus
created: 2026-05-29

steps:
  - action: "编排骨架：建立 canonical schema、data source registry 与 validate 主干"
    exit_signal: "fake corpus 可执行 validate；is_eval_dataset=True、denylist source、未授权 source 会失败并给出清晰错误"
    status: done

  - action: "导入节点：实现本地 json/jsonl/parquet instruction-QA 到 canonical corpus 的导入流程"
    exit_signal: "3-5 条 fake medical/finance 样本能导入 dataset；manifest 的 domain/source 计数与输入一致"
    status: done

  - action: "生成节点：实现 optional generated_response 回写与 resume/limit 控制"
    exit_signal: "小样本生成或 smoke/stub 路径能填充 generated_response、response_generator、response_generated_at；--resume 不重复生成已有结果"
    status: done

  - action: "构建节点：按 response field 和 tokenizer 构建 Static SAM artifact"
    exit_signal: "source_response 和 generated_response 两个 response field 均可构建小 .pkl；产物能被 samd.load_sam() smoke load"
    status: done

  - action: "持久化与可观测：完善 corpus manifest 与 artifact manifest"
    exit_signal: "manifest 记录 corpus、source/domain 分布、response field、tokenizer、cutoff_len、跳过/截断统计、strict no-eval 结果和 smoke_load 结果"
    status: done

  - action: "测试覆盖：补齐小样本 pipeline 与污染防护边界规则"
    exit_signal: "local import、denylist、eval flag、空 response field、artifact build/load、manifest 统计都有自动或手工可复现证据"
    status: done

