feature: 2026-06-01-sam-eagle3-tree-union-pruning
created: 2026-06-01

steps:
  - action: "配置骨架：新增 Stage B fusion 策略与 budget 配置"
    exit_signal: "默认 none / sam_sequence_graft 行为不变；sam_tree_union_prune 仅支持 eagle3；budget 类型和值域错误能明确报错"
    status: done
  - action: "计算节点：让主路径 DynSAM 支持在线 cnt_endpos 与 tree draft metadata"
    exit_signal: "DynSAM 更新 token 时维护 cnt_endpos；无需 --sam_path 也能从当前在线状态生成 root 为 start_token 的多分支 tree"
    status: done
  - action: "计算节点：实现 Dynamic SAM tree draft + SAM-side pruning"
    exit_signal: "手写 SAM 状态在给定 budget 下满足 max_nodes / max_depth / top_k；路径闭包成立；child 排序遵守在线 cnt_endpos"
    status: done
  - action: "计算节点：实现 TreeSpec union"
    exit_signal: "EAGLE3 小树 + SAM 小树 union 后复用 shared prefix，不出现同父同 token 重复节点，buffers 可 round-trip"
    status: done
  - action: "编排接入：DraftModel lookup Stage B branch"
    exit_signal: "SAM match 不足返回纯 EAGLE3；match 达阈值返回 union-pruned tree；EAGLE3 pending hidden states 正常消费"
    status: done
  - action: "可观测性：记录 fused tree size 与 budget 命中情况"
    exit_signal: "p1 / p2 输出或 stdout 可看到 budget 参数、node_count、sam_added_nodes、merged_nodes、budget_hit"
    status: done
  - action: "实验闭环：跑最小 Stage B ablation"
    exit_signal: "MT-Bench / MedQuAD 至少完成 Stage A vs Stage B 的 p1 speed 与 p2 V_miss 对比，并按失败规则记录结论"
    status: done

