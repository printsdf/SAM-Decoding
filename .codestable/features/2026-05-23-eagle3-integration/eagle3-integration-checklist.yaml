feature: 2026-05-23-eagle3-integration
created: 2026-05-23

steps:
  - action: "新建包骨架 + Config：建 samd/tree_model/eagle3/ 包，放空 __init__.py、eagle3_config.py（精简 EConfig）、eagle3_utils.py（拷贝 cnets.py 的 LlamaAttention/MLP/RMSNorm/LlamaDecoderLayeremb building blocks）"
    exit_signal: "python -c 'from samd.tree_model.eagle3 import Eagle3' 不报 import 错误（Eagle3 可为空 stub）"
    status: done

  - action: "移植 Eagle3Model：按 ../EAGLE/eagle/model/cnets.py:Model 实现 __init__ / forward / topK_genrate / init_tree / load_weight，load_weight 支持 pytorch_model.bin + safetensors 两种格式，strict=False"
    exit_signal: "用真实 EAGLE3 权重调 load_weight 返回的 unexpected_keys 为空、missing_keys 至多是 {d2t, t2d} 子集；构造后 fc.weight.shape[1] == 3*hidden_size 且 lm_head.weight.shape[0] == draft_vocab_size"
    status: done

  - action: "集成类 Eagle3:实现 Eagle3(TreeModel) 的 reset/update/gen_draft/gen_buffers，重点处理 topK_genrate 4-元组 → samd 2-元组（pred_ids list + buffers dict）翻译"
    exit_signal: "单独构造 Eagle3 + mock accept_hidden_states（3H 维）+ 调 gen_draft(start_token) 能产出 (List[int], dict)，dict 含 tree_attn_mask / tree_position_ids / tree_retrieve_indices 三键"
    status: done

  - action: "base model 多层 patch：实现 samd/model_patch/llama_eagle3.py，patched LlamaModel.forward 在 idx ∈ {2, N//2, N-3} 三个位置抓 hidden state 并 dim=-1 concat 成 3H，作为 outputs.last_hidden_states 暴露"
    exit_signal: "用最小 Llama 实例（LlamaConfig(num_hidden_layers=8)）+ patched forward 单步 forward 后 outputs.last_hidden_states.shape[-1] == 3 * hidden_size"
    status: done

  - action: "接通注册与选择：修改 tree_model/__init__.py（加 eagle3 键）、samd_config.py（Literal 加 eagle3 + __post_init__ 分支 + load_eagle3 函数）、model_patch/__init__.py（导出 eagle3_patch_dict）、samd_model.py:register_forward_patch（按 tree_method 选 patch_dict）"
    exit_signal: "SamdConfig(tree_method='eagle3', tree_model_path=PATH) 构造成功；SamdModel(...) 初始化时打印的 patch setattr 日志显示走 eagle3 路径"
    status: done

  - action: "端到端验证：参照 tests/test_samd.py 模式写 EAGLE3 路径用例（真实权重 + 兼容 Llama base），与 base model generate(do_sample=False) 逐 token 对比；再回归跑 eagle / eagle2 / token_recycle 三条原路径"
    exit_signal: "eagle3 路径生成 50 个 token 与 base greedy 逐 token 一致；其他三路径输出与改动前 byte-equal；git diff samd/tree_model/eagle2/ samd/tree_model/eagle/ samd/tree_model/token_recycle/ samd_sam_only/ 为空"
    status: done

